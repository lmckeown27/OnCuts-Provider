<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clear CampusCuts Cache</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
      background: #f5f5f5;
    }
    .status {
      background: white;
      padding: 30px;
      border-radius: 12px;
      margin: 20px 0;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    button {
      background: #7C3AED;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px;
    }
    button:hover {
      background: #6D28D9;
    }
    .success {
      color: #059669;
      font-weight: bold;
    }
    .error {
      color: #DC2626;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🧹 Clear CampusCuts Cache</h1>
  
  <div class="status">
    <h2>Current Status</h2>
    <p id="sw-status">Checking service worker...</p>
    <p id="cache-status">Checking caches...</p>
  </div>

  <button onclick="clearEverything()">Clear All Cache & Restart</button>
  <button onclick="window.location.href='/'">Go to App</button>

  <div id="results"></div>

  <script>
    async function checkStatus() {
      const swStatus = document.getElementById('sw-status');
      const cacheStatus = document.getElementById('cache-status');
      
      // Check service worker
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        swStatus.innerHTML = `Service Workers: <strong>${registrations.length}</strong> registered`;
      } else {
        swStatus.innerHTML = 'Service Workers: <strong>Not supported</strong>';
      }
      
      // Check caches
      if ('caches' in window) {
        const cacheNames = await caches.keys();
        cacheStatus.innerHTML = `Caches: <strong>${cacheNames.length}</strong> (${cacheNames.join(', ') || 'none'})`;
      } else {
        cacheStatus.innerHTML = 'Caches: <strong>Not supported</strong>';
      }
    }

    async function clearEverything() {
      const results = document.getElementById('results');
      results.innerHTML = '<div class="status"><h3>Clearing...</h3></div>';
      
      let log = [];
      
      try {
        // 1. Unregister all service workers
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const registration of registrations) {
            await registration.unregister();
            log.push(`✅ Unregistered service worker: ${registration.scope}`);
          }
        }
        
        // 2. Clear all caches
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          for (const cacheName of cacheNames) {
            await caches.delete(cacheName);
            log.push(`✅ Deleted cache: ${cacheName}`);
          }
        }
        
        // 3. Clear localStorage
        localStorage.clear();
        log.push('✅ Cleared localStorage');
        
        // 4. Clear sessionStorage
        sessionStorage.clear();
        log.push('✅ Cleared sessionStorage');
        
        // 5. Clear IndexedDB
        if ('indexedDB' in window) {
          const databases = await indexedDB.databases();
          for (const db of databases) {
            indexedDB.deleteDatabase(db.name);
            log.push(`✅ Deleted IndexedDB: ${db.name}`);
          }
        }
        
        log.push('<br><strong class="success">✅ ALL CACHE CLEARED!</strong>');
        log.push('<br>Reloading in 2 seconds...');
        
        results.innerHTML = `<div class="status">${log.join('<br>')}</div>`;
        
        // Reload after 2 seconds
        setTimeout(() => {
          window.location.href = '/';
        }, 2000);
        
      } catch (error) {
        results.innerHTML = `<div class="status"><p class="error">Error: ${error.message}</p></div>`;
      }
    }

    // Check status on load
    window.addEventListener('load', checkStatus);
  </script>
</body>
</html>
