<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusCuts - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-center;
      padding: 20px;
    }
    
    .container {
      text-align: center;
      background: white;
      padding: 48px 32px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      max-width: 480px;
      width: 100%;
    }
    
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-center;
      font-size: 40px;
    }
    
    h1 {
      font-size: 28px;
      color: #1a202c;
      margin-bottom: 12px;
    }
    
    p {
      color: #4a5568;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    
    .features {
      text-align: left;
      margin: 24px 0;
      padding: 20px;
      background: #f7fafc;
      border-radius: 12px;
    }
    
    .features h3 {
      font-size: 14px;
      color: #667eea;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    
    .features ul {
      list-style: none;
    }
    
    .features li {
      padding: 8px 0;
      color: #4a5568;
      font-size: 14px;
    }
    
    .features li:before {
      content: "✓ ";
      color: #667eea;
      font-weight: bold;
      margin-right: 8px;
    }
    
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    .status {
      margin-top: 20px;
      padding: 12px;
      background: #fff5f5;
      border-left: 4px solid #fc8181;
      border-radius: 4px;
      text-align: left;
      font-size: 14px;
      color: #742a2a;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      CampusCuts needs an internet connection to access the latest barber profiles,
      availability, and bookings.
    </p>
    
    <div class="features">
      <h3>When you're back online:</h3>
      <ul>
        <li>View available barbers</li>
        <li>Check upcoming appointments</li>
        <li>Send booking requests</li>
        <li>Message barbers directly</li>
      </ul>
    </div>
    
    <button onclick="window.location.reload()">
      Try Again
    </button>
    
    <div class="status" id="status" style="display: none;">
      <strong>Connection Status:</strong> <span id="status-text">Checking...</span>
    </div>
  </div>
  
  <script>
    // Check online status
    function updateOnlineStatus() {
      const statusDiv = document.getElementById('status');
      const statusText = document.getElementById('status-text');
      
      if (navigator.onLine) {
        statusText.textContent = 'Connected! Click "Try Again" to reload.';
        statusDiv.style.background = '#f0fff4';
        statusDiv.style.borderLeftColor = '#48bb78';
        statusDiv.style.color = '#22543d';
      } else {
        statusText.textContent = 'No internet connection detected.';
        statusDiv.style.background = '#fff5f5';
        statusDiv.style.borderLeftColor = '#fc8181';
        statusDiv.style.color = '#742a2a';
      }
      
      statusDiv.style.display = 'block';
    }
    
    // Check status on page load
    window.addEventListener('load', updateOnlineStatus);
    
    // Monitor online/offline events
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    
    // Auto-reload when back online
    window.addEventListener('online', () => {
      setTimeout(() => {
        window.location.reload();
      }, 1000);
    });
  </script>
</body>
</html>
